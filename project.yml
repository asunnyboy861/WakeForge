name: WakeForge
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
targets:
  WakeForge:
    type: application
    platform: iOS
    sources:
      - path: WakeForge
        excludes:
          - "Info.plist"
          - "WakeForge.entitlements"
    entitlements:
      path: WakeForge/WakeForge.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzoutuo.WakeForge
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.WakeForge
        PRODUCT_NAME: WakeForge
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WakeForge/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: GLMProxySecret.txt
    info:
      path: WakeForge/Info.plist
      properties:
        CFBundleDisplayName: WakeForge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "Copyright © 2026 he zhou"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAlarmKitUsageDescription: "WakeForge schedules the morning alarms you create, so your wake-up task is ready before your feet hit the floor."
        NSCameraUsageDescription: "WakeForge uses the front camera to count your reps. Video is analyzed on this device and never leaves your phone."
        NSPhotoLibraryUsageDescription: "Pick a photo from your library when the camera is unavailable. Photos are verified and then discarded."
        NSHealthShareUsageDescription: "WakeForge reads today's step count to verify your morning step goal. Data stays on your device."
        NSHealthUpdateUsageDescription: "WakeForge does not write health data."
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.zzoutuo.WakeForge
            CFBundleURLSchemes:
              - wakeforge
    dependencies:
      - target: WakeForgeWidgetExtension
        embed: true
  WakeForgeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WakeForgeWidget
        excludes:
          - "Info.plist"
          - "WakeForgeWidget.entitlements"
      - path: WakeForge/Shared
    entitlements:
      path: WakeForgeWidget/WakeForgeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zzoutuo.WakeForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.WakeForge.Widget
        PRODUCT_NAME: WakeForgeWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WakeForgeWidget/Info.plist
        SKIP_INSTALL: YES
    info:
      path: WakeForgeWidget/Info.plist
      properties:
        CFBundleDisplayName: WakeForge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  WakeForge:
    build:
      targets:
        WakeForge: all
    run:
      config: Debug
    archive:
      config: Release
